      function __resizeIframe(obj) {
        const scrollbarHeight = 20; // Max between windows, mac, and linux

        function setHeight() {
          // Guard against race condition where iframe isn't ready
          if (!obj.contentWindow?.document?.documentElement) {
            return;
          }
          const element = obj.contentWindow.document.documentElement;
          // If there is no vertical scrollbar, we don't need to resize the iframe
          if (element.scrollHeight === element.clientHeight) {
            return;
          }

          // Create a new height that includes the scrollbar height if it's visible
          const hasHorizontalScrollbar = element.scrollWidth > element.clientWidth;
          const newHeight = element.scrollHeight + (hasHorizontalScrollbar ? scrollbarHeight : 0);

          // Only update the height if it's different from the current height
          if (obj.style.height !== `${newHeight}px`) {
            obj.style.height = `${newHeight}px`;
          }
        }

        // Resize the iframe to the height of the content and bottom scrollbar height
        setHeight();

        // Resize the iframe when the content changes
        const resizeObserver = new ResizeObserver((_entries) => {
          setHeight();
        });
        // Only observe if iframe content is ready
        if (obj.contentWindow?.document?.body) {
          resizeObserver.observe(obj.contentWindow.document.body);
        }
      }
    </script>

            "session": {"cells": [{"code_hash": "220853c1a9e3a0b6e520d72c94cb44f6", "console": [], "id": "Hbol", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "d9953eb20fbd997cc1fe30decbe04325", "console": [], "id": "MJUe", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch1 id=\"i-sanidad-vegetal-y-manejo-integrado-de-plagas-mip\"\u003EI. Sanidad Vegetal y Manejo Integrado de Plagas (MIP)\u003C/h1\u003E\n\u003Ch2 id=\"fundamento-biologico-y-matematico\"\u003EFundamento Biol\u00f3gico y Matem\u00e1tico\u003C/h2\u003E\n\u003Cspan class=\"paragraph\"\u003EEl modelo central de este m\u00f3dulo es la \u003Cstrong\u003Eacumulaci\u00f3n de Grados-D\u00eda (GD)\u003C/strong\u003E, que describe la\nrelaci\u00f3n entre temperatura y desarrollo de insectos o enfermedades:\u003C/span\u003E\n\u003Cmarimo-tex class=\"arithmatex\"\u003E||[GD = \\sum_{i=1}^{n} \\max\\left(0, \\frac{T_{max,i} + T_{min,i}}{2} - T_{base}\\right)||]\u003C/marimo-tex\u003E\u003Cspan class=\"paragraph\"\u003EEl \u003Cstrong\u003E\u00cdndice de Riesgo de Enfermedad (IRE)\u003C/strong\u003E combina temperatura y humedad relativa mediante:\u003C/span\u003E\n\u003Cmarimo-tex class=\"arithmatex\"\u003E||[IRE = \\frac{1}{n}\\sum_{i=1}^{n} \\mathbb{1}\\left[T_i \\in [T_{opt,min}, T_{opt,max}] \\cap HR_i \u0026gt; HR_{umbral}\\right] \\cdot w_i||]\u003C/marimo-tex\u003E\u003Cspan class=\"paragraph\"\u003EEl \u003Cstrong\u003ENDVI\u003C/strong\u003E (\u00cdndice de Vegetaci\u00f3n de Diferencia Normalizada) se calcula como:\u003C/span\u003E\n\u003Cmarimo-tex class=\"arithmatex\"\u003E||[NDVI = \\frac{\\rho_{NIR} - \\rho_{Red}}{\\rho_{NIR} + \\rho_{Red}} \\in [-1, 1]||]\u003C/marimo-tex\u003E\u003Cspan class=\"paragraph\"\u003EValores de NDVI \u0026lt; 0.4 en cultivos adultos pueden indicar estr\u00e9s bi\u00f3tico o abi\u00f3tico.\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "85a0c3cee1b9703b9b59
