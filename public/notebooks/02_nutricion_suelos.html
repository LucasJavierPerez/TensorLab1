      function __resizeIframe(obj) {
        const scrollbarHeight = 20; // Max between windows, mac, and linux

        function setHeight() {
          // Guard against race condition where iframe isn't ready
          if (!obj.contentWindow?.document?.documentElement) {
            return;
          }
          const element = obj.contentWindow.document.documentElement;
          // If there is no vertical scrollbar, we don't need to resize the iframe
          if (element.scrollHeight === element.clientHeight) {
            return;
          }

          // Create a new height that includes the scrollbar height if it's visible
          const hasHorizontalScrollbar = element.scrollWidth > element.clientWidth;
          const newHeight = element.scrollHeight + (hasHorizontalScrollbar ? scrollbarHeight : 0);

          // Only update the height if it's different from the current height
          if (obj.style.height !== `${newHeight}px`) {
            obj.style.height = `${newHeight}px`;
          }
        }

        // Resize the iframe to the height of the content and bottom scrollbar height
        setHeight();

        // Resize the iframe when the content changes
        const resizeObserver = new ResizeObserver((_entries) => {
          setHeight();
        });
        // Only observe if iframe content is ready
        if (obj.contentWindow?.document?.body) {
          resizeObserver.observe(obj.contentWindow.document.body);
        }
      }
    </script>

            "session": {"cells": [{"code_hash": "d7278375f12c6fc2bee8b1430784e4a5", "console": [], "id": "Hbol", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "1776dffb28bef80750a85221cf264fad", "console": [], "id": "MJUe", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch1 id=\"ii-nutricion-de-cultivos-y-fertilidad-de-suelos\"\u003EII. Nutrici\u00f3n de Cultivos y Fertilidad de Suelos\u003C/h1\u003E\n\u003Ch2 id=\"fundamento-agronomico-y-matematico\"\u003EFundamento Agron\u00f3mico y Matem\u00e1tico\u003C/h2\u003E\n\u003Ch3 id=\"modelo-de-respuesta-de-mitscherlich\"\u003EModelo de Respuesta de Mitscherlich\u003C/h3\u003E\n\u003Cspan class=\"paragraph\"\u003EDescribe la relaci\u00f3n entre dosis de fertilizante y rendimiento:\u003C/span\u003E\n\u003Cmarimo-tex class=\"arithmatex\"\u003E||[Y = Y_{max} \\cdot \\left(1 - e^{-c(x + b)}\\right)||]\u003C/marimo-tex\u003E\u003Cspan class=\"paragraph\"\u003EDonde \u003Cmarimo-tex class=\"arithmatex\"\u003E||(Y_{max}||)\u003C/marimo-tex\u003E es el rendimiento m\u00e1ximo potencial, \u003Cmarimo-tex class=\"arithmatex\"\u003E||(c||)\u003C/marimo-tex\u003E es el coeficiente de respuesta\ny \u003Cmarimo-tex class=\"arithmatex\"\u003E||(b||)\u003C/marimo-tex\u003E el nutriente disponible en el suelo.\u003C/span\u003E\n\u003Ch3 id=\"kriging-ordinario-geoestadistica\"\u003EKriging Ordinario (Geoestad\u00edstica)\u003C/h3\u003E\n\u003Cspan class=\"paragraph\"\u003ELa varianza de predicci\u00f3n en un punto no muestreado \u003Cmarimo-tex class=\"arithmatex\"\u003E||(\\mathbf{x_0}||)\u003C/marimo-tex\u003E:\u003C/span\u003E\n\u003Cmarimo-tex class=\"arithmatex\"\u003E||[\\hat{Z}(\\mathbf{x_0}) = \\sum_{i=1}^{n} \\lambda_i Z(\\mathbf{x_i})||]\u003C/marimo-tex\u003E\u003Cspan class=\"paragraph\"\u003ECon restricci\u00f3n \u003Cmarimo-tex class=\"arithmatex\"\u003E||(\\sum \\lambda_i = 1||)\u003C/marimo-tex\u003E (insesgamiento). El variograma experimental:\u003C/span\u003E\n\u003Cmarimo-tex class=\"arithmatex\"\u003E||[\\hat{\\gamma}(h) = \\frac{1}{2|N(h)|} \\sum_{N(h)} [Z(\\mathbf{x_i}) - Z(\\mathbf{x_j})]^2||]\u003C/marimo-tex\u003E\u003Ch3 id=\"zonificacion-por-clustering-k-means\"\u003EZonificaci\u00f3n por Clustering (K-Means)\u003C/h3\u003E\n\u003Cspan class=\"paragraph\"\u003ESe agrupan las muestras en zonas de manejo homog\u00e9neo minimizando:\u003C/span\u003E\n\u003Cmarimo-tex class=\"arithmatex\"\u003E||[J = \\sum_{k=1}^{K} \\sum_{\\mathbf{x} \\in C_k} \\|\\mathbf{x} - \\boldsymbol{\\mu}_k\\|^2||]\u003C/marimo-tex\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "bb93205e1dd8ed3a4fc1eecc326221bf", "console": [], "id": "vblA", "outputs": [{"data": {"text/html": "\u003Cdiv style='display: flex;flex: 1;flex-direction: column;justify-content: flex-start;align-items: normal;flex-wrap: nowrap;gap: 0.5rem'\u003E\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch2 id=\"parametros\"\u003EPar\u00e1metros\u003C/h2\u003E\u003C/span\u003E\u003Cdiv style='display: flex;flex: 1;flex-direction: row;justify-content: space-between;align-items: normal;flex-wrap: nowrap;gap: 0.5rem'\u003E\u003Cmarimo-ui-element object-id='vblA-0' random-id='1fb5162f-3281-5490-56b4-13f0e9c816d8'\u003E\u003Cmarimo-slider data-initial-value='3' data-label='\u0026quot;\u0026#92;u003cspan class=\u0026#92;\u0026quot;markdown prose dark:prose-invert contents\u0026#92;\u0026quot;\u0026#92;u003e\u0026#92;u003cspan class=\u0026#92;\u0026quot;paragraph\u0026#92;\u0026quot;\u0026#92;u003eN\u00famero de Zonas de Manejo (K-Means)\u0026#92;u003c/span\u0026#92;u003e\u0026#92;u003c/span\u0026#92;u003e\u0026quot;' data-start='2' data-stop='6' data-step='1' data-steps='[]' data-debounce='false' data-disabled='false' data-orientation='\u0026quot;horizontal\u0026quot;' data-show-value='false' data-include-input='false' data-full-width='false'\u003E\u003C/marimo-slider\u003E\u003C/marimo-ui-element\u003E\u003Cmarimo-
