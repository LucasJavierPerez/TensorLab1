      function __resizeIframe(obj) {
        const scrollbarHeight = 20; // Max between windows, mac, and linux

        function setHeight() {
          // Guard against race condition where iframe isn't ready
          if (!obj.contentWindow?.document?.documentElement) {
            return;
          }
          const element = obj.contentWindow.document.documentElement;
          // If there is no vertical scrollbar, we don't need to resize the iframe
          if (element.scrollHeight === element.clientHeight) {
            return;
          }

          // Create a new height that includes the scrollbar height if it's visible
          const hasHorizontalScrollbar = element.scrollWidth > element.clientWidth;
          const newHeight = element.scrollHeight + (hasHorizontalScrollbar ? scrollbarHeight : 0);

          // Only update the height if it's different from the current height
          if (obj.style.height !== `${newHeight}px`) {
            obj.style.height = `${newHeight}px`;
          }
        }

        // Resize the iframe to the height of the content and bottom scrollbar height
        setHeight();

        // Resize the iframe when the content changes
        const resizeObserver = new ResizeObserver((_entries) => {
          setHeight();
        });
        // Only observe if iframe content is ready
        if (obj.contentWindow?.document?.body) {
          resizeObserver.observe(obj.contentWindow.document.body);
        }
      }

            "session": {"cells": [{"code_hash": "885e1b3c1fc1cd367f44a55bce4f56a3", "console": [], "id": "Hbol", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "e9c79e193d026eaa10d1c90a6b1bccb6", "console": [], "id": "MJUe", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch1 id=\"x-economia-agraria-y-toma-de-decisiones\"\u003EX. Econom\u00eda Agraria y Toma de Decisiones\u003C/h1\u003E\n\u003Ch2 id=\"fundamento-optimizacion-de-mix-de-rotacion-pulp-lp\"\u003EFundamento: Optimizaci\u00f3n de Mix de Rotaci\u00f3n (PuLP / LP)\u003C/h2\u003E\n\u003Ch3 id=\"programacion-lineal-mix-optimo-de-cultivos\"\u003EProgramaci\u00f3n Lineal \u2014 Mix \u00d3ptimo de Cultivos\u003C/h3\u003E\n\u003Cmarimo-tex class=\"arithmatex\"\u003E||[\\max_{x} \\quad \\mathbf{c}^T \\mathbf{x} \\quad \\text{(Margen Bruto Total)}||]\u003C/marimo-tex\u003E\u003Cspan class=\"paragraph\"\u003ESujeto a:\u003C/span\u003E\n\u003Cmarimo-tex class=\"arithmatex\"\u003E||[\\mathbf{A}\\mathbf{x} \\leq \\mathbf{b} \\quad \\text{(restricciones de capital, agua, rotaci\u00f3n)}||]\u003C/marimo-tex\u003E\u003Cmarimo-tex class=\"arithmatex\"\u003E||[x_i \\geq 0, \\quad \\sum_i x_i = S_{total}||]\u003C/marimo-tex\u003E\u003Ch3 id=\"simulacion-de-monte-carlo-riesgo-financiero\"\u003ESimulaci\u00f3n de Monte Carlo \u2014 Riesgo Financiero\u003C/h3\u003E\n\u003Cspan class=\"paragraph\"\u003ELa distribuci\u00f3n de resultados bajo incertidumbre de precios y rindes:\u003C/span\u003E\n\u003Cmarimo-tex class=\"arithmatex\"\u003E||[MB_i = \\sum_c (P_{c,i} \\cdot Y_{c,i} - C_c) \\cdot x_c, \\quad i = 1, \\ldots, N_{sim}||]\u003C/marimo-tex\u003E\u003Cspan class=\"paragraph\"\u003ECon \u003Cmarimo-tex class=\"arithmatex\"\u003E||(P_{c,i} \\sim \\mathcal{LN}(\\mu_c, \\sigma_c)||)\u003C/marimo-tex\u003E y \u003Cmarimo-tex class=\"arithmatex\"\u003E||(Y_{c,i} \\sim \\mathcal{N}(\\bar{Y}_c, CV_c \\cdot \\bar{Y}_c)||)\u003C/marimo-tex\u003E.\u003C/span\u003E\n\u003Ch3 id=\"value-at-risk-agricola-var\"\u003EValue at Risk Agr\u00edcola (VaR)\u003C/h3\u003E\n\u003Cmarimo-tex class=\"arithmatex\"\u003E||[VaR_\\alpha = -\\inf\\{m \\in \\mathbb{R} : P(MB \u0026lt; m) \u0026gt; \\alpha\\}||]\u003C/marimo-tex\u003E\u003Cspan class=\"paragraph\"\u003EAl nivel \u003Cmarimo-tex class=\"arithmatex\"\u003E||(\\alpha = 5\\%||)\u003C/marimo-tex\u003E: el percentil 5 de la distribuci\u00f3n de m\u00e1rgenes brutos.\u003C/span\u003E\n\u003Ch3 id=\"prediccion-de-precios-con-prophet-meta\"\u003EPredicci\u00f3n de Precios con Prophet (Meta)\u003C/h3\u003E\n\u003Cspan class=\"paragraph\"\u003EDescompone la serie en tendencia + estacionalidad + holidays:\u003C/span\u003E\n\u003Cmarimo-tex class=\"arithmatex\"\u003E||[y(t) = g(t) + s(t) + h(t) + \\varepsilon_t||]\u003C/marimo-tex\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "d458114f0d09451f1ef07e098f7497d0", "console": [], "id": "vblA", "outputs": [{"data": {"text/html": "\u003Cdiv style='display: flex;flex: 1;flex-direction: column;justify-content: flex-start;align-items: normal;flex-wrap: nowrap;gap: 0.5rem'\u003E\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch2 id=\"parametros-economicos-y-de-simulacion\"\u003EPar\u00e1metros Econ\u00f3micos y de Simulaci\u00f3n\u003C/h2\u003E\u003C/span\u003E\u003Cdiv style='display: flex;flex: 1;flex-direction: row;justify-content: space-between;align-items: normal;flex-wrap: nowrap;gap: 0.5rem'\u003E\u003Cmarimo-ui-element object-id='vblA-0' random-id='e600b898-b3a6-384c-c6b0-8dcc34b4d1c9'\u003E\u003Cmarimo-number data-initial-value='1000' data-label='\u0026quot;\u0026lt;span class=\u0026#92;\u0026quot;markdown prose dark:prose-invert contents\u0026#92;\u0026quot;\u0026gt;\u0026lt;span class=\u0026#92;\u0026quot;paragraph\u0026#92;\u0026quot;\u0026gt;Superficie total (ha)\u0026lt;/span\u0026gt;\u0026lt;/span\u0026gt;\u0026quot;' data-start='100' data-stop='5000' data-step='100' data-debounce
